name: phase1-contour-patch

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/golden-contours-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/golden-contours-phase1
          fetch-depth: 0
      - name: Patch approved preview handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/studio.tsx')
          text = path.read_text()
          old = '''      const aiPalette = activeProject.aiPalette?.length
        ? activeProject.aiPalette
        : await selectProductionColors(activeProject.aiPreviewUrl, palette, Math.min(aiColorCount, palette.length));
      const paletteReadyPreview = activeProject.aiPalette?.length
        ? activeProject.aiPreviewUrl
        : await snapImageToProductionPalette(activeProject.aiPreviewUrl, aiPalette);'''
          new = '''      // A manually uploaded production preview may already be the exact Hobruk
      // palette raster. In that case it is the geometry source of truth and must
      // not be snapped/cleaned a second time before connected regions are built.
      let exactUploadedPalette: PaintColor[] | null = null;
      if (!activeProject.aiPalette?.length) {
        const previewImage = new Image();
        previewImage.src = activeProject.aiPreviewUrl;
        await previewImage.decode();
        const previewCanvas = document.createElement("canvas");
        previewCanvas.width = previewImage.width;
        previewCanvas.height = previewImage.height;
        const previewContext = previewCanvas.getContext("2d", { willReadFrequently: true })!;
        previewContext.imageSmoothingEnabled = false;
        previewContext.drawImage(previewImage, 0, 0);
        const previewPixels = previewContext.getImageData(0, 0, previewCanvas.width, previewCanvas.height).data;
        const paletteByRgb = new Map<number, PaintColor>();
        for (const paint of palette) {
          const rgb = Number.parseInt(paint.hex.slice(1), 16);
          paletteByRgb.set(rgb, paint);
        }
        const usedPaintIds = new Set<number>();
        let exactProductionRaster = true;
        for (let offset = 0; offset < previewPixels.length; offset += 4) {
          if (previewPixels[offset + 3] !== 255) { exactProductionRaster = false; break; }
          const rgb = (previewPixels[offset] << 16) | (previewPixels[offset + 1] << 8) | previewPixels[offset + 2];
          const paint = paletteByRgb.get(rgb);
          if (!paint) { exactProductionRaster = false; break; }
          usedPaintIds.add(paint.id);
        }
        if (exactProductionRaster && usedPaintIds.size) {
          // Keep the master palette order so production numbering stays stable.
          exactUploadedPalette = palette.filter((paint) => usedPaintIds.has(paint.id));
        }
      }
      const aiPalette = activeProject.aiPalette?.length
        ? activeProject.aiPalette
        : exactUploadedPalette
          ? exactUploadedPalette
          : await selectProductionColors(activeProject.aiPreviewUrl, palette, Math.min(aiColorCount, palette.length));
      const paletteReadyPreview = activeProject.aiPalette?.length || exactUploadedPalette
        ? activeProject.aiPreviewUrl
        : await snapImageToProductionPalette(activeProject.aiPreviewUrl, aiPalette);'''
          if old not in text:
              raise SystemExit('Expected prepareProductionMap snippet not found; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- app/studio.tsx; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/studio.tsx
          git commit -m "fix: preserve exact approved palette preview geometry"
          git push origin HEAD:fix/golden-contours-phase1
